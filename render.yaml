# Exactly two services. Review paid compute pricing before applying this blueprint.
services:
  - type: web
    name: cinesense-api
    runtime: docker
    plan: pro
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OLLAMA_MODEL
        value: gemma2:2b
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "120"
      - key: DB_PATH
        value: /var/data/user_preferences.db
    disk:
      name: preferences
      mountPath: /var/data
      sizeGB: 1
  - type: web
    name: cinesense
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
